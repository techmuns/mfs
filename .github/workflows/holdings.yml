name: Refresh holdings (monthly)

# Builds public/data/holdings.json from AMC monthly portfolio disclosures, then re-runs the main
# build so funds.json picks up the holdings summaries. Portfolio disclosures post ~10 days after
# month-end, so this runs on the 8th (and can be run on demand).
on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 2 8 * *'   # 02:07 UTC on the 8th ≈ 07:37 IST

concurrency:
  group: refresh-holdings
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  holdings:
    runs-on: ubuntu-latest
    env:
      # Bedrock is optional — used only to parse odd/PDF-only AMC layouts. Absent secrets are fine;
      # the job falls back to deterministic parsing and reports coverage honestly.
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BEDROCK_MODEL_IDS: ${{ secrets.BEDROCK_MODEL_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build holdings
        run: node scripts/holdings.mjs

      - name: Rebuild data (pick up holdings summaries + refresh enrichment)
        run: node scripts/build.mjs

      - name: Commit & push
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): monthly holdings refresh ($(date -u +%Y-%m-%d))"
          n=0
          until [ "$n" -ge 4 ]; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "Pushed."; exit 0; fi
            n=$((n + 1))
            echo "Push rejected; syncing (attempt $n/4)…"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((2 * n))
          done
          echo "Failed to push after retries." >&2
          exit 1
