<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mutual Fund Screener — Indian Equity</title>
  <meta name="description" content="A free, colourful, research-only screener for Indian equity mutual funds: returns, risk, rolling consistency and peer-group comparisons computed from real NAV history." />

  <!-- Fetch the entry module early so its import graph resolves in parallel with the stylesheet/fonts. -->
  <link rel="modulepreload" href="./js/app.js" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: {
      sans: ['Inter', 'system-ui', 'sans-serif'],
      display: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
    } } } };
  </script>
  <style>
    body {
      background:
        radial-gradient(1200px 600px at 12% -12%, #eef2ff 0%, transparent 60%),
        radial-gradient(1000px 520px at 100% -8%, #faf5ff 0%, transparent 55%),
        radial-gradient(900px 500px at 50% 112%, #ecfeff 0%, transparent 55%),
        #f8fafc;
      background-attachment: fixed;
    }
    .tnum, td.num, th.num { font-variant-numeric: tabular-nums; }
    td.num, th.num { text-align: right; }

    /* cards & inputs */
    .card { background:#fff; border-radius:1rem; box-shadow:0 1px 2px rgba(2,6,23,.04),0 2px 8px rgba(2,6,23,.05); outline:1px solid rgba(226,232,240,.7); }
    .inp { width:100%; border-radius:.75rem; border:0; background:#fff; padding:.5rem .75rem; font-size:.875rem; color:#334155; box-shadow:inset 0 0 0 1px #e2e8f0; }
    .inp:focus { outline:2px solid #6366f1; outline-offset:0; }
    .lbl { display:block; margin-bottom:.35rem; font-size:.6875rem; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:#64748b; }
    .range { width:100%; accent-color:#6366f1; cursor:pointer; }

    /* toggles & switches */
    .toggle-off,.toggle-on { padding:.375rem .75rem; border-radius:9999px; font-size:.75rem; font-weight:600; cursor:pointer; border:0; }
    .toggle-off { background:#f1f5f9; color:#64748b; }
    .toggle-on { background:#eef2ff; color:#4f46e5; box-shadow:inset 0 0 0 1px #c7d2fe; }
    .switch { display:inline-flex; width:30px; height:17px; border-radius:9999px; background:#cbd5e1; vertical-align:middle; padding:2px; transition:background .15s; }
    .switch-on { background:#6366f1; }
    .switch .knob { display:block; width:13px; height:13px; border-radius:50%; background:#fff; transition:transform .15s; }
    .switch-on .knob { transform:translateX(13px); }

    /* value colours */
    .v-pos{color:#059669}.v-neg{color:#e11d48}.v-zero{color:#64748b}.v-na{color:#cbd5e1}.v-dim{color:#cbd5e1}.v-strong{font-weight:600}
    .pill{display:inline-block;padding:.125rem .5rem;border-radius:9999px;font-size:.6875rem;font-weight:600;white-space:nowrap}
    .idx-badge{display:inline-block;padding:0 .3rem;border-radius:4px;background:#ccfbf1;color:#0f766e;font-size:9px;font-weight:700;letter-spacing:.02em;vertical-align:middle}
    .qmark{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:#e2e8f0;color:#64748b;font-size:9px;font-weight:700;cursor:help}

    /* table */
    .table-scroll::-webkit-scrollbar{height:10px}
    .table-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    th.sortable{cursor:pointer;user-select:none}
    th.sortable:hover{color:#4f46e5}
    .sort-caret::after{content:'↕';opacity:.35;margin-left:.2rem;font-size:.7em}
    .sort-asc::after{content:'↑';margin-left:.2rem;font-size:.7em;color:#4f46e5}
    .sort-desc::after{content:'↓';margin-left:.2rem;font-size:.7em;color:#4f46e5}

    /* tabs */
    .tabbtn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem .9rem;border-radius:.75rem;font-size:.875rem;font-weight:600;color:#64748b;cursor:pointer;border:0;background:transparent}
    .tabbtn:hover{color:#4f46e5}
    .tabbtn-on{background:#fff;color:#4f46e5;box-shadow:0 1px 2px rgba(2,6,23,.06);outline:1px solid rgba(226,232,240,.8)}
    .subtab{padding:.375rem .75rem;border-radius:.6rem;font-size:.8125rem;font-weight:600;color:#64748b;cursor:pointer;border:0;background:transparent;white-space:nowrap}
    .subtab:hover{color:#4f46e5;background:#f8fafc}
    .subtab-on{background:#eef2ff;color:#4f46e5}
    .alert-chip{padding:.25rem .625rem;border-radius:9999px;font-size:.6875rem;font-weight:600;color:#64748b;background:#f1f5f9;cursor:pointer;border:0}
    .alert-chip-on{background:#eef2ff;color:#4f46e5;box-shadow:inset 0 0 0 1px #c7d2fe}
    .pk-toggle{cursor:pointer;background:none;border:0;padding:0}

    /* drill slide-in */
    .drill-panel{transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1)}
    .drill-open{transform:translateX(0)}

    /* shimmer */
    .shimmer{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);background-size:400% 100%;animation:sh 1.4s ease infinite}
    @keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}

    /* ---- shared "premium grid" table (Compare + fund-detail tables) ---- */
    .gridtbl{border-collapse:separate;border-spacing:0}
    .gridtbl th,.gridtbl td{border-bottom:1px solid #eef1f6;border-right:1px solid #eef1f6;white-space:nowrap;padding:.5rem .75rem}
    .gridtbl thead th{border-top:1px solid #e2e8f0;background:#f8fafc}
    .gridtbl th:first-child,.gridtbl td:first-child{border-left:1px solid #eef1f6}
    .gridtbl td.num,.gridtbl th.num{text-align:right;font-variant-numeric:tabular-nums}

    /* ---- screener table: locked header + locked first column, crisp grid ---- */
    #screener-table .tbl-scroll{max-height:calc(100vh - 220px);overflow:auto}
    #screener-table table{border-collapse:separate;border-spacing:0;table-layout:fixed}
    #screener-table th,#screener-table td{
      border-bottom:1px solid #eef1f6;border-right:1px solid #eef1f6;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.5rem .75rem;
    }
    #screener-table th:first-child,#screener-table td:first-child{border-left:1px solid #eef1f6}
    #screener-table thead th{
      position:sticky;top:0;z-index:2;background:#eef2f8;color:#475569;
      box-shadow:inset 0 -1px 0 #cbd5e1;
      vertical-align:bottom;overflow:visible;
    }
    /* uniform header: a wrapping label on top, then a single ?/sort row aligned at the bottom of every column */
    #screener-table thead th .th-label{display:block;white-space:normal;line-height:1.15;font-weight:600}
    #screener-table thead th .th-meta{display:block;margin-top:2px;line-height:1;white-space:nowrap;font-weight:400}
    #screener-table td.num,#screener-table th.num{text-align:right;font-variant-numeric:tabular-nums}
    /* sticky left columns (checkbox col 0, Fund col 1) keep a solid bg + edge shadow */
    #screener-table th.stick,#screener-table td.stick{position:sticky;z-index:1;background:#fff}
    #screener-table thead th.stick{z-index:4;background:#eef2f8}
    #screener-table .stick-0{left:0}
    /* checkbox column: no ellipsis artifact, centred control */
    #screener-table th.stick-0,#screener-table td.stick-0{overflow:visible;text-overflow:clip;text-align:center;padding-left:0;padding-right:0}
    #screener-table .stick-1{left:40px;box-shadow:1px 0 0 #e2e8f0}
    #screener-table tbody tr:hover td.stick-1{background:#eef2ff}
    #screener-table .fund-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ---- popovers (Filters / Screening steps) ---- */
    .pop{position:absolute;left:0;right:0;top:100%;margin-top:.5rem;z-index:30;
      border-radius:1rem;background:#fff;box-shadow:0 12px 40px rgba(2,6,23,.16);outline:1px solid rgba(226,232,240,.9);padding:1rem}
    .chev{display:inline-block;transition:transform .18s}
    .chev-open{transform:rotate(180deg)}
    .ctl-btn{display:inline-flex;align-items:center;gap:.35rem;border-radius:.6rem;background:#f1f5f9;padding:.4rem .7rem;font-size:.8125rem;font-weight:600;color:#475569;cursor:pointer;border:0;white-space:nowrap}
    .ctl-btn:hover{background:#e2e8f0}
    .ctl-btn-on{background:#eef2ff;color:#4f46e5;box-shadow:inset 0 0 0 1px #c7d2fe}
    .ctl-badge{display:inline-flex;min-width:16px;justify-content:center;border-radius:9999px;background:#6366f1;padding:0 .25rem;font-size:.625rem;font-weight:700;color:#fff}

    /* ---- slim KPI strip ---- */
    .kpi-strip{display:flex;flex-wrap:wrap;align-items:stretch;gap:0;overflow:hidden}
    .kpi-item{flex:1 1 0;min-width:150px;padding:.6rem .9rem;border-right:1px solid #eef1f6}
    .kpi-item:last-child{border-right:0}
    .kpi-k{font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8}
    .kpi-v{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:1.125rem;line-height:1.2;font-variant-numeric:tabular-nums}
    .kpi-sub{font-size:.6875rem;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  </style>
</head>
<body class="min-h-screen font-sans text-slate-800 antialiased">

  <!-- loading -->
  <div id="app-loading" class="grid min-h-screen place-items-center">
    <div class="text-center">
      <div class="mx-auto mb-4 h-10 w-10 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div>
      <div class="font-display text-sm font-semibold text-slate-500">Loading fund data…</div>
    </div>
  </div>

  <div id="app-shell" class="hidden">
    <!-- sticky header -->
    <header class="sticky top-0 z-30 border-b border-slate-200/70 bg-white/80 backdrop-blur-lg">
      <div class="mx-auto max-w-[1500px] px-4 sm:px-6">
        <div class="flex flex-wrap items-center gap-3 py-3">
          <div class="flex items-center gap-2.5">
            <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-400 text-white shadow-sm">
              <span class="font-display text-base font-extrabold">₹</span></div>
            <div>
              <h1 class="font-display text-lg font-extrabold leading-none tracking-tight text-slate-900">Mutual Fund Screener</h1>
              <div class="text-[11px] text-slate-400">Indian equity · Direct · Growth</div>
            </div>
          </div>
          <span id="live-chip" class="rounded-full bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-600 ring-1 ring-inset ring-emerald-200 tnum"></span>

          <div class="relative ml-auto w-full sm:w-80">
            <input id="global-search" type="search" placeholder="Search any fund…" autocomplete="off"
              class="inp !pl-9" />
            <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" class="pointer-events-none absolute left-3 top-2.5 h-4 w-4"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <div id="search-drop" class="absolute left-0 right-0 z-40 mt-1 hidden max-h-96 overflow-y-auto rounded-xl bg-white py-1 shadow-xl ring-1 ring-slate-200"></div>
          </div>
          <div class="relative">
            <button id="btn-bell" class="relative rounded-lg bg-slate-100 p-2 text-slate-600 hover:bg-slate-200" aria-label="What's new" title="What's new">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="h-5 w-5"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span id="bell-badge" class="hidden absolute -right-1 -top-1 min-w-[16px] rounded-full bg-rose-500 px-1 text-center text-[10px] font-bold leading-4 text-white tnum">0</span></button>
            <div id="bell-root"></div>
          </div>
          <button id="btn-sources" class="rounded-lg bg-slate-100 px-3 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-200">Sources</button>
        </div>

        <!-- tabs -->
        <nav class="flex gap-1 overflow-x-auto pb-2">
          <button data-tabbtn="screener" class="tabbtn tabbtn-on">Screener</button>
          <button data-tabbtn="detail" class="tabbtn">Fund Details</button>
          <button data-tabbtn="compare" class="tabbtn">Compare</button>
          <button data-tabbtn="shortlist" class="tabbtn">Shortlist
            <span id="shortlist-badge" class="hidden rounded-full bg-amber-500 px-1.5 text-[10px] font-bold text-white tnum">0</span></button>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-[1500px] px-4 py-5 sm:px-6">
      <div data-tabpanel="screener" id="tab-screener"></div>
      <div data-tabpanel="detail" id="tab-detail" class="hidden"></div>
      <div data-tabpanel="compare" id="tab-compare" class="hidden"></div>
      <div data-tabpanel="shortlist" id="tab-shortlist" class="hidden"></div>
    </main>

    <footer class="mx-auto max-w-[1500px] px-4 pb-8 pt-2 text-center text-xs text-slate-400 sm:px-6">
      Research &amp; education only — not investment advice · Data © AMFI &amp; MFAPI.in · Every figure carries its source &amp; as-of date
    </footer>
  </div>

  <div id="drill-root"></div>
  <div id="modal-root"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
